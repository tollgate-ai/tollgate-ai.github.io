# Checks for this repository. Install once with:
#   pipx install pre-commit==4.7.0 && pre-commit install
# CI runs the pre-commit stage on each pull request.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^tsconfig\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: commit-message
        name: "commit message: type(scope): subject"
        entry: '\A(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9-]+\)!?: \S'
        language: pygrep
        args: [--multiline, --negate]
        stages: [commit-msg]
      - id: build
        name: "type check and build"
        entry: npm run build
        language: system
        pass_filenames: false
        stages: [pre-push]
