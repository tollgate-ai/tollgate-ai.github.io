# Build the Tollgate website, and publish a release at https://tollgate-ai.github.io/.
# The pictures come from tollgate-ai/tollgate's docs/diagrams, so the build
# checks that repository out next to this one.
#
# A release publishes: release.yml calls this workflow with the new tag, because
# a release made with the default token starts no other workflow. A pull request
# only builds. To publish a tag again, run it by hand from the Actions tab and
# pick the tag under "Use workflow from".
name: deploy
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The release tag to publish, such as v1.0.0
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOLLGATE_DIR: ${{ github.workspace }}/tollgate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tollgate-ai/tollgate
          path: tollgate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check the files
        if: github.event_name == 'pull_request'
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure
      - name: Build the site
        run: |
          npm ci
          npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
