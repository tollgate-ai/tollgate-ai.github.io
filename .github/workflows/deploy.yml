# Build the Tollgate website, and publish a release at https://tollgate-ai.github.io/.
# The pictures come from tollgate-ai/tollgate's docs/diagrams, so the build
# checks that repository out next to this one.
#
# A release publishes: release.yml calls this workflow with the new tag, because
# a release made with the default token starts no other workflow. A pull request
# only builds. To publish a tag again, run it by hand from the Actions tab and
# pick the tag under "Use workflow from".
name: deploy
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The release tag to publish, such as v1.0.0
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOLLGATE_DIR: ${{ github.workspace }}/tollgate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: tollgate-ai/tollgate
          path: tollgate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Build the site
        run: |
          npm ci
          npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
