# Build the Tollgate website, and publish a release at https://tollgate-ai.github.io/.
# The pictures come from tollgate-ai/tollgate's docs/diagrams, so the build
# checks that repository out next to this one.
#
# A release publishes: release.yml calls this workflow with the new tag, because
# a release made with the default token starts no other workflow. A pull request
# only builds. To publish a tag again, run it by hand from the Actions tab.
name: deploy
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The release tag to publish, such as v1.0.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag to publish, such as v1.0.0
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TOLLGATE_DIR: ${{ github.workspace }}/tollgate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tollgate-ai/tollgate
          path: tollgate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the site
        run: |
          npm ci
          npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
